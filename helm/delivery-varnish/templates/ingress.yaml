apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.service.name }}
  labels:
    chart: "{{ .Chart.Name | trunc 63 }}"
    chartVersion: "{{ .Chart.Version | trunc 63 }}"
    app: {{ .Values.service.name }}
    visualize: "true"
    hasHealthcheck: "{{ .Values.service.hasHealthcheck }}"
  annotations:
    alb.ingress.kubernetes.io/scheme: "{{ .Values.alb.scheme }}"
    alb.ingress.kubernetes.io/target-type: "{{ .Values.alb.targetType }}"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.service.certificateAwsArn }}"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/tags: "{{ .Values.elb.tags }}"
    {{- if eq .Values.s3.enabled "true" }}
    alb.ingress.kubernetes.io/load-balancer-attributes: "access_logs.s3.enabled=true,access_logs.s3.bucket={{ .Values.s3.bucketName }},access_logs.s3.prefix={{ .Values.s3.prefix }}"
    {{- end }}
    external-dns: enabled
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.service.external_dns_hostname }}"
    external-dns.alpha.kubernetes.io/ttl: "30"
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.service.external_dns_hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.name }}
                port:
                  number: 80
